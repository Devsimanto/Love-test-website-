name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure correct folder structure
        run: |
          if [ ! -d "src" ]; then
            echo "Auto-organizing flat files into src structure..."
            mkdir -p src/components src/services src/utils
            [ -f "main.tsx" ] && cp main.tsx src/
            [ -f "App.tsx" ] && cp App.tsx src/
            [ -f "index.css" ] && cp index.css src/
            [ -f "firebase.ts" ] && cp firebase.ts src/
            [ -f "types.ts" ] && cp types.ts src/
            [ -f "CreateLetterForm.tsx" ] && cp CreateLetterForm.tsx src/components/
            [ -f "LetterCreatedSuccess.tsx" ] && cp LetterCreatedSuccess.tsx src/components/
            [ -f "VictimView.tsx" ] && cp VictimView.tsx src/components/
            [ -f "AdminTrackerView.tsx" ] && cp AdminTrackerView.tsx src/components/
            [ -f "LanguageToggle.tsx" ] && cp LanguageToggle.tsx src/components/
            [ -f "letterService.ts" ] && cp letterService.ts src/services/
            [ -f "audio.ts" ] && cp audio.ts src/utils/
            [ -f "i18n.ts" ] && cp i18n.ts src/utils/
            [ -f "memes.ts" ] && cp memes.ts src/utils/
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite application
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: '/Love-test-website-/'
        run: npx vite build --base=/Love-test-website-/ && cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
